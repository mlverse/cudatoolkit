on:
  push:
    branches:
      - main
      - "rocm*"
  pull_request:
  workflow_dispatch:

name: test-install

jobs:
  test-install:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: [cuda12.6, cuda12.8, cuda12.9, cuda13.2]

    name: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install package
        run: |
          cd ${{ matrix.package }}
          R CMD INSTALL .

      - name: Verify RUNPATH contains $ORIGIN
        run: |
          LIB_PATH=$(Rscript -e 'cat(${{ matrix.package }}::lib_path())')
          echo "lib_path: $LIB_PATH"

          echo "=== Checking RUNPATH on .so files ==="
          FAILED=0
          for so in "$LIB_PATH"/*.so*; do
            [ -f "$so" ] || continue
            # Skip symlinks
            [ -L "$so" ] && continue

            RUNPATH=$(readelf -d "$so" 2>/dev/null | grep -E 'RUNPATH|RPATH' || true)
            if echo "$RUNPATH" | grep -q '\$ORIGIN'; then
              echo "OK: $(basename "$so")"
            else
              echo "FAIL: $(basename "$so") — RUNPATH does not contain \$ORIGIN"
              echo "  $RUNPATH"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "ERROR: Some libraries are missing \$ORIGIN in RUNPATH"
            exit 1
          fi

          echo ""
          echo "=== All libraries have \$ORIGIN in RUNPATH ==="

  test-rocm:
    runs-on: ubuntu-22.04
    env:
      ROCM_COMPONENTS: core,hipblas-common,hip-dev,hsa-dev

    name: rocm6.4

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install package
        run: |
          cd rocm6.4
          R CMD INSTALL .

      - name: Verify paths and headers
        run: |
          Rscript -e '
            stopifnot(requireNamespace("rocm6.4", quietly = TRUE))
            inc <- rocm6.4::include_path()
            lib <- rocm6.4::lib_path()
            cat("include_path:", inc, "\n")
            cat("lib_path:", lib, "\n")
            stopifnot(file.exists(file.path(inc, "hip", "hip_runtime.h")))
            stopifnot(file.exists(file.path(inc, "hsa", "hsa.h")))
            stopifnot(file.exists(file.path(inc, "hipblas-common", "hipblas-common.h")))
            ver <- readLines(file.path(inc, "..", ".info", "version"))
            cat("rocm version:", ver, "\n")
            stopifnot(grepl("^6\\.4", ver))
            stopifnot(length(list.files(lib, pattern = "\\.so")) > 0)
          '

      - name: Verify RPATH contains \$ORIGIN
        run: |
          LIB_PATH=$(Rscript -e 'cat(rocm6.4::lib_path())')
          for so in "$LIB_PATH"/*.so*; do
            [ -f "$so" ] || continue
            [ -L "$so" ] && continue
            readelf -d "$so" | grep -q '\$ORIGIN' || {
              echo "FAIL: $(basename "$so") is missing \$ORIGIN in RPATH"
              exit 1
            }
          done
          echo "=== All ROCm libraries have \$ORIGIN in RPATH ==="
